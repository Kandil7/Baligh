name: CPT Training

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "CPT Stage"
        type: choice
        options: [stage1, stage2, islamic]
        default: stage1
      resume:
        description: "Resume from checkpoint"
        type: boolean
        default: false

jobs:
  cpt-training:
    runs-on: self-hosted
    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements/training.txt
          pip install -e .
      - name: Run CPT Training
        run: |
          python -m src.scripts.run_cpt \
            --data-dir data/train_ready/cpt \
            --output-dir training/cpt \
            --eval-data data/train_ready/cpt_eval
