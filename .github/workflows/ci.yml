name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e .
      - name: Run ruff
        run: ruff check src/
      - name: Run black
        run: black --check src/
      - name: Run mypy
        run: mypy src/
      - name: Run tests
        run: pytest tests/ -v --cov=src/baligh --cov-fail-under=80
