name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0, v0.1)"
        type: string
        required: true
      model_type:
        description: "Model type to release"
        type: choice
        options: [base, instruct, both]
        default: instruct
      repo_id:
        description: "Target HF repo ID"
        type: string
        default: "Kandil7/Baligh-1.7B"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements/deployment.txt
          pip install -e .
      - name: Push Instruct Model
        if: inputs.model_type == 'instruct' || inputs.model_type == 'both'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO_ID: ${{ inputs.repo_id }}
          VERSION: ${{ inputs.version }}
        run: |
          python -m src.scripts.push_to_hf \
            --model-path training/sft/final \
            --repo-id "$REPO_ID" \
            --token "$HF_TOKEN" \
            --commit-message "Release $VERSION: Baligh-1.7B instruct model"
      - name: Push Base Model (CPT)
        if: inputs.model_type == 'base' || inputs.model_type == 'both'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO_ID: ${{ inputs.repo_id }}
          VERSION: ${{ inputs.version }}
        run: |
          python -m src.scripts.push_to_hf \
            --model-path training/cpt/final \
            --repo-id "$REPO_ID-base" \
            --token "$HF_TOKEN" \
            --commit-message "Release $VERSION: Baligh-1.7B base model"
      - name: Generate Model Card
        if: inputs.model_type == 'instruct' || inputs.model_type == 'both'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m src.scripts.generate_model_card \
            --output "release/baligh-1.7b-${VERSION}-instruct/README.md" \
            --mmlu-score TBD --cidar-rouge TBD --islamic-rouge TBD --perplexity TBD
      - name: Create GitHub Release
        env:
          VERSION: ${{ inputs.version }}
          REPO_ID: ${{ inputs.repo_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --title "Baligh-1.7B $VERSION" \
            --notes "Release of Baligh-1.7B $VERSION

          Models available on Hugging Face:
          - $REPO_ID"
