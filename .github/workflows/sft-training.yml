name: SFT Training

on:
  workflow_dispatch:
    inputs:
      base_model:
        description: "Path to base model (after CPT)"
        type: string
        default: "training/cpt/final"

permissions:
  contents: read

jobs:
  sft-training:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Secrets scoped to the step that needs them — not job-level, so the
      # dependency-install step (third-party setup code) never sees tokens.
      - name: Install dependencies
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          pip install -r requirements/training.txt
          pip install -e .
      - name: Run SFT Training
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          BASE_MODEL: ${{ inputs.base_model }}
        run: |
          python -m src.scripts.run_sft \
            --data-dir data/train_ready/sft \
            --output-dir training/sft \
            --eval-data data/train_ready/sft_eval \
            --base-model "$BASE_MODEL"
