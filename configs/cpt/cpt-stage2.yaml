cpt:
  # Stage 2: Full CPT run 
  dataset_mix:
    arabicweb24: 0.7
    arabictext_large: 0.2
    arabic_pile: 0.1
  islamic_cycle: true
  max_steps: 50000
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_steps: 1000
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  optim: "adamw_torch_fused"
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  eval_strategy: "steps"
  dataloader_num_workers: 4
  packing: true
