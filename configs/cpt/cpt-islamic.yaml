cpt:
  # Islamic CPT cycle
  dataset_mix: {}
  islamic_cycle: true
  islamic_datasets:
    - hadith_datasets
    - quran_qa
    - quran_md
    - arabic_islamic_texts
  max_steps: 5000
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 200
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  optim: adamw_torch_fused
  logging_steps: 5
  save_steps: 250
  eval_steps: 250
  evaluation_strategy: steps
  dataloader_num_workers: 4
  packing: true
