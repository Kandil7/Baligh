sft:
  max_steps: 10
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 0
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  optim: "adamw_8bit"
  logging_steps: 1
  save_steps: 9999
  eval_steps: 9999
  eval_strategy: "no"
  load_best_model_at_end: false
  dataloader_num_workers: 0
  packing: false
  response_only_loss: true